name: Forja Neural Quartz APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🟢 LA MAGIA: Le pedimos a Ubuntu que genere el Wrapper por nosotros
    - name: Generar Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4

    - name: Dar permisos de ejecución
      run: chmod +x gradlew

    - name: Forjar APK
      run: ./gradlew assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: Neural-Quartz-App
        path: app/build/outputs/apk/debug/app-debug.apk
