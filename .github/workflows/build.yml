name: Forja Neural Quartz APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🟢 LA CURA: Instalamos Gradle 8.4 puro en la máquina virtual
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    # 🟢 EL ENSAMBLAJE: Como ya instalamos la v8.4 globalmente, usamos 'gradle' en vez de './gradlew'
    - name: Forjar APK
      run: gradle assembleDebug

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: Neural-Quartz-App
        path: app/build/outputs/apk/debug/app-debug.apk
