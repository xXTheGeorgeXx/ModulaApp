name: Build Engine (Modula)

# Builds libmodula_engine.so from llama.cpp + the JNI wrapper, on a
# Linux runner with the official Android NDK r29.
# NOT tested in CI yet — first run will show whether the workflow works
# as written. The engine was verified with the same scripts on a Linux
# VM on 2026-11-06 (llama.cpp commit bcb01528).

on:
  push:
    branches: [main]
    paths:
      - "factory/**"
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build git wget unzip

      - name: Build engine (Linux factory)
        run: |
          bash factory/linux/setup_linux.sh
          bash factory/linux/prepare_modula.sh
          bash factory/linux/build_cpu.sh
        env:
          BASE_DIR: ${{ github.workspace }}

      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: modula-engine-arm64
          path: |
            MOTORES_LISTOS/jniLibs/arm64-v8a/libmodula_engine-stripped.so
            MOTORES_LISTOS/jniLibs/arm64-v8a/libomp.so
